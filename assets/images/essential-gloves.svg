<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGloves" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141920"/>
      <stop offset="60%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>
    <linearGradient id="blackGlove" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="40%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="chromeLoupe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="gloveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGloves)"/>
  <circle cx="400" cy="300" r="280" fill="#38bdf8" opacity="0.04" filter="blur(70px)"/>

  <g filter="url(#gloveShadow)">
    <!-- Pair of Black Microfiber Handling Gloves -->
    <!-- Left Glove -->
    <g transform="translate(260, 260) rotate(-15)">
      <!-- Palm and Wrist -->
      <path d="M -50 40 C -50 -30 -30 -60 0 -70 C 30 -60 50 -30 50 40 L 40 100 L -40 100 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <!-- Thumb -->
      <path d="M -45 -10 C -70 -25 -75 -50 -55 -65 C -40 -70 -30 -50 -35 -20 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <!-- Fingers -->
      <path d="M -30 -65 C -35 -110 -15 -115 -10 -65 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <path d="M -10 -68 C -12 -125 10 -125 10 -68 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <path d="M 10 -65 C 10 -115 28 -110 25 -65 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <path d="M 25 -50 C 30 -95 48 -90 40 -45 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
    </g>

    <!-- Right Glove -->
    <g transform="translate(540, 260) rotate(15)">
      <path d="M -50 40 C -50 -30 -30 -60 0 -70 C 30 -60 50 -30 50 40 L 40 100 L -40 100 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <path d="M 45 -10 C 70 -25 75 -50 55 -65 C 40 -70 30 -50 35 -20 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <path d="M 30 -65 C 35 -110 15 -115 10 -65 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <path d="M 10 -68 C 12 -125 -10 -125 -10 -68 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <path d="M -10 -65 C -10 -115 -28 -110 -25 -65 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
      <path d="M -25 -50 C -30 -95 -48 -90 -40 -45 Z" fill="url(#blackGlove)" stroke="#3f3f46" stroke-width="1.5"/>
    </g>

    <!-- Centerpiece: Polished Steel 10x Triplet Loupe resting on Dark Microfiber Cloth -->
    <g transform="translate(400, 285)">
      <!-- Swivel Teardrop Casing -->
      <path d="M -45 0 C -45 -50 45 -50 45 0 C 45 35 15 65 0 85 C -15 65 -45 35 -45 0 Z" fill="url(#chromeLoupe)" stroke="#64748b" stroke-width="2"/>
      
      <!-- Optical Glass Lens -->
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="0" cy="0" r="28" fill="#1e293b"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
      
      <!-- Lens Reflection Arc -->
      <path d="M -16 -18 A 20 20 0 0 1 16 -18" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
      
      <!-- Loupe Inscription -->
      <text x="0" y="55" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="700" font-size="9" text-anchor="middle">10X TRIPLET</text>
      <text x="0" y="66" fill="#475569" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">21mm ACHROMATIC</text>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="525" fill="#cbd5e1" font-family="'Playfair Display', serif" font-weight="700" font-size="16" letter-spacing="4" text-anchor="middle">OPTICAL INSPECTION SET</text>
  <text x="400" y="542" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">LINT-FREE MICROFIBER GLOVES · 10X ACHROMATIC TRIPLET LOUPE</text>
</svg>
