<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBench" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="60%" stop-color="#0f0d0b"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="knurledSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="forkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="toolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgBench)"/>
  <circle cx="400" cy="300" r="280" fill="#d4af37" opacity="0.04" filter="blur(70px)"/>

  <g filter="url(#toolShadow)" transform="rotate(-30 400 300)">
    <!-- Main Knurled Steel Tool Handle -->
    <rect x="180" y="282" width="440" height="36" rx="6" fill="url(#knurledSteel)"/>

    <!-- Diamond Knurling Pattern Cross-Hatching -->
    <g opacity="0.4">
      <line x1="220" y1="282" x2="260" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="240" y1="282" x2="280" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="260" y1="282" x2="300" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="280" y1="282" x2="320" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="300" y1="282" x2="340" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="460" y1="282" x2="500" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="480" y1="282" x2="520" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="500" y1="282" x2="540" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="520" y1="282" x2="560" y2="318" stroke="#0f172a" stroke-width="1.5"/>

      <line x1="260" y1="282" x2="220" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="280" y1="282" x2="240" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="300" y1="282" x2="260" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="320" y1="282" x2="280" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="340" y1="282" x2="300" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="500" y1="282" x2="460" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="520" y1="282" x2="480" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="540" y1="282" x2="500" y2="318" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="560" y1="282" x2="520" y2="318" stroke="#0f172a" stroke-width="1.5"/>
    </g>

    <!-- Center Metric Scale & Swiss Inscription -->
    <rect x="350" y="286" width="100" height="28" fill="#1e293b"/>
    <text x="400" y="304" fill="#d4af37" font-family="'Inter', sans-serif" font-weight="700" font-size="10" letter-spacing="2" text-anchor="middle">SWISS 60 HRC</text>

    <!-- Left Tip: Micro-Fork (For Flanged Spring Bars) -->
    <path d="M 180 292 L 110 295 L 90 290 L 105 300 L 90 310 L 110 305 L 180 308 Z" fill="url(#forkSteel)"/>

    <!-- Right Tip: Cylindrical Pointed Pin (For Drilled Lug Holes) -->
    <path d="M 620 294 L 690 298 L 710 300 L 690 302 L 620 306 Z" fill="url(#forkSteel)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="525" fill="#cbd5e1" font-family="'Playfair Display', serif" font-weight="700" font-size="16" letter-spacing="4" text-anchor="middle">SWISS SPRING-BAR INSTRUMENT</text>
  <text x="400" y="542" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">60 HRC TEMPERED TOOL STEEL · REVERSIBLE MICRO-FORK & PIN</text>
</svg>
