<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLeather" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c1613"/>
      <stop offset="60%" stop-color="#0c0907"/>
      <stop offset="100%" stop-color="#030202"/>
    </radialGradient>
    <linearGradient id="saffianoNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cognacTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="goldSnap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="velvetCushion" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="60%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#292524"/>
    </radialGradient>
    <filter id="rollShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgLeather)"/>
  <circle cx="400" cy="300" r="280" fill="#d97706" opacity="0.04" filter="blur(70px)"/>

  <g filter="url(#rollShadow)">
    <!-- 3-Watch Prism Travel Roll Structure -->
    <!-- Cylindrical Saffiano Navy Body -->
    <rect x="140" y="160" width="520" height="240" rx="36" fill="url(#saffianoNavy)" stroke="#334155" stroke-width="2"/>

    <!-- Perimeter Cognac Hand-Stitching -->
    <rect x="152" y="172" width="496" height="216" rx="26" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- 3 Watch Compartment Dividers & Cushions -->
    <!-- Slot 1 (Left) -->
    <g transform="translate(230, 280)">
      <rect x="-55" y="-75" width="110" height="150" rx="20" fill="url(#velvetCushion)" stroke="#1c1917" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="35" ry="55" fill="none" stroke="#78716c" stroke-width="8"/>
      <!-- Watch on Cushion -->
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#d4af37" stroke-width="2"/>
      <circle cx="0" cy="0" r="24" fill="#020617"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#d4af37" stroke-width="2"/>
      <line x1="0" y1="0" x2="10" y2="0" stroke="#d4af37" stroke-width="2"/>
    </g>

    <!-- Slot 2 (Center) -->
    <g transform="translate(400, 280)">
      <rect x="-55" y="-75" width="110" height="150" rx="20" fill="url(#velvetCushion)" stroke="#1c1917" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="35" ry="55" fill="none" stroke="#78716c" stroke-width="8"/>
      <!-- Watch on Cushion -->
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="24" fill="#0f2b48"/>
      <line x1="0" y1="0" x2="-8" y2="-12" stroke="#38bdf8" stroke-width="2"/>
      <line x1="0" y1="0" x2="12" y2="6" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <!-- Slot 3 (Right) -->
    <g transform="translate(570, 280)">
      <rect x="-55" y="-75" width="110" height="150" rx="20" fill="url(#velvetCushion)" stroke="#1c1917" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="35" ry="55" fill="none" stroke="#78716c" stroke-width="8"/>
      <!-- Watch on Cushion -->
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#d4af37" stroke-width="2"/>
      <circle cx="0" cy="0" r="24" fill="#f5eee6"/>
      <line x1="0" y1="0" x2="0" y2="-14" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="#1e3a8a" stroke-width="2"/>
    </g>

    <!-- Top Closure Flap with Cognac Leather Accent Straps & Gold Snap Buttons -->
    <path d="M 140 160 L 660 160 L 640 210 L 160 210 Z" fill="url(#cognacTrim)"/>
    
    <!-- 4 Gold Snap Fasteners -->
    <circle cx="210" cy="185" r="9" fill="url(#goldSnap)"/>
    <circle cx="335" cy="185" r="9" fill="url(#goldSnap)"/>
    <circle cx="465" cy="185" r="9" fill="url(#goldSnap)"/>
    <circle cx="590" cy="185" r="9" fill="url(#goldSnap)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="525" fill="#d97706" font-family="'Playfair Display', serif" font-weight="700" font-size="16" letter-spacing="4" text-anchor="middle">SAFFIANO 3-SLOT TRAVEL ROLL</text>
  <text x="400" y="542" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">MIDNIGHT NAVY & COGNAC LEATHER · ALCANTARA COMPARTMENT WALLS</text>
</svg>
