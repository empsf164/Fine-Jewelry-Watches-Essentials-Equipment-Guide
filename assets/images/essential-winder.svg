<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWinder" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="walnutLacquered" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="30%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="goldBezelWinder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="rotorInterior" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="ledGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="winderShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgWinder)"/>
  <circle cx="400" cy="285" r="260" fill="#0284c7" opacity="0.04" filter="blur(70px)"/>

  <g filter="url(#winderShadow)">
    <!-- Main Piano-Black / Walnut Cabinet Case -->
    <rect x="230" y="100" width="340" height="370" rx="24" fill="url(#walnutLacquered)" stroke="#3f3f46" stroke-width="2"/>

    <!-- High-Gloss Beveled Edge Highlight -->
    <rect x="240" y="110" width="320" height="350" rx="18" fill="none" stroke="#52525b" stroke-width="1"/>

    <!-- Tempered Glass Viewing Window Frame -->
    <rect x="255" y="125" width="290" height="285" rx="14" fill="#030712" stroke="#27272a" stroke-width="2"/>

    <!-- Soft White Interior Ambient LED Ring -->
    <circle cx="400" cy="265" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" filter="url(#ledGlow)"/>

    <!-- Dual Rotating Pod / Cup Mechanism -->
    <circle cx="400" cy="265" r="110" fill="url(#rotorInterior)"/>
    <circle cx="400" cy="265" r="110" fill="none" stroke="url(#goldBezelWinder)" stroke-width="3"/>

    <!-- Watch Pillow Mount in Rotor Cup -->
    <g transform="translate(400, 265)">
      <!-- Velvet Cushion -->
      <rect x="-42" y="-60" width="84" height="120" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="30" ry="50" fill="none" stroke="#27272a" stroke-width="6"/>

      <!-- Automatic Watch Mounted Vertically -->
      <circle cx="0" cy="0" r="38" fill="url(#goldBezelWinder)"/>
      <circle cx="0" cy="0" r="34" fill="#09090b"/>
      <circle cx="0" cy="0" r="30" fill="#0f172a"/>
      
      <!-- Watch Hands & Dial -->
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#ffffff" stroke-width="2"/>
      <line x1="0" y1="0" x2="14" y2="8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#d4af37"/>
    </g>

    <!-- Lower Control Switch & Status Screen -->
    <rect x="270" y="420" width="260" height="35" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    
    <!-- OLED TPD Status Indicator -->
    <text x="320" y="442" fill="#38bdf8" font-family="'Inter', monospace" font-weight="700" font-size="11">650 TPD · BI-DIR</text>
    
    <!-- Touch Sensor Controls -->
    <circle cx="460" cy="437" r="7" fill="#18181b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="495" cy="437" r="7" fill="#18181b" stroke="#d4af37" stroke-width="1"/>
  </g>

  <!-- Typography -->
  <text x="400" y="525" fill="#fde047" font-family="'Playfair Display', serif" font-weight="700" font-size="16" letter-spacing="4" text-anchor="middle">ROTO-MATIC WATCH WINDER</text>
  <text x="400" y="542" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">SILENT MABUCHI MOTOR · 650–1800 TURNS PER DAY · TEMPERED GLASS</text>
</svg>
