<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSapphRing" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111928"/>
      <stop offset="60%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="cushionSapphire" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="85%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="platRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="sideDiamond" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
    <filter id="sapphGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="sparkle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgSapphRing)"/>

  <!-- Velvet Blue Ambient Flare -->
  <circle cx="400" cy="300" r="280" fill="#2563eb" opacity="0.07" filter="blur(70px)"/>

  <g filter="url(#ringShadow)">

    <!-- Lower Platinum Ring Shank (Circular Band viewed in 3D perspective) -->
    <ellipse cx="400" cy="380" rx="140" ry="85" fill="none" stroke="url(#platRing)" stroke-width="26"/>
    <ellipse cx="400" cy="380" rx="140" ry="85" fill="none" stroke="#080e1a" stroke-width="6"/>

    <!-- Shank Shoulder / Knife-Edge Tapering towards the Center Setting -->
    <path d="M 260 380 Q 300 280 340 260 L 345 285 Q 310 320 275 395 Z" fill="url(#platRing)"/>
    <path d="M 540 380 Q 500 280 460 260 L 455 285 Q 490 320 525 395 Z" fill="url(#platRing)"/>

    <!-- Left Tapered Trapezoid Diamond Side Stone -->
    <g transform="translate(305, 235)">
      <polygon points="-25,35 15,20 15,-20 -25,-15" fill="url(#sideDiamond)" stroke="url(#platRing)" stroke-width="2"/>
      <line x1="-25" y1="35" x2="15" y2="-20" stroke="#ffffff" stroke-width="1"/>
      <circle cx="-5" cy="5" r="3" fill="#ffffff" filter="url(#sparkle)"/>
    </g>

    <!-- Right Tapered Trapezoid Diamond Side Stone -->
    <g transform="translate(495, 235)">
      <polygon points="25,35 -15,20 -15,-20 25,-15" fill="url(#sideDiamond)" stroke="url(#platRing)" stroke-width="2"/>
      <line x1="25" y1="35" x2="-15" y2="-20" stroke="#ffffff" stroke-width="1"/>
      <circle cx="5" cy="5" r="3" fill="#ffffff" filter="url(#sparkle)"/>
    </g>

    <!-- Main Center Cushion 5.10 ct Kashmir Sapphire Head -->
    <g transform="translate(400, 220)">

      <!-- Platinum Basket & 4 Eagle Claw Prongs Under-gallery -->
      <rect x="-85" y="-75" width="170" height="150" rx="36" fill="url(#platRing)"/>
      <rect x="-78" y="-68" width="156" height="136" rx="30" fill="#040812"/>

      <!-- Cushion Cut Sapphire Gemstone -->
      <rect x="-74" y="-64" width="148" height="128" rx="28" fill="url(#cushionSapphire)" filter="url(#sapphGlow)"/>

      <!-- Internal Geometric Table & Kite Facet Lines -->
      <polygon points="0,-64 74,0 0,64 -74,0" fill="#60a5fa" opacity="0.35"/>
      <polygon points="-42,-34 42,-34 54,0 42,34 -42,34 -54,0" fill="none" stroke="#bfdbfe" stroke-width="1.75" opacity="0.8"/>
      
      <line x1="-74" y1="-64" x2="-42" y2="-34" stroke="#bfdbfe" stroke-width="1.75" opacity="0.8"/>
      <line x1="74" y1="-64" x2="42" y2="-34" stroke="#bfdbfe" stroke-width="1.75" opacity="0.8"/>
      <line x1="74" y1="64" x2="42" y2="34" stroke="#bfdbfe" stroke-width="1.75" opacity="0.8"/>
      <line x1="-74" y1="64" x2="-42" y2="34" stroke="#bfdbfe" stroke-width="1.75" opacity="0.8"/>

      <!-- Velvety Rutile Glow Inclusions & Table Reflection -->
      <ellipse cx="-24" cy="-18" rx="22" ry="12" fill="#ffffff" opacity="0.85" transform="rotate(-25 -24 -18)" filter="url(#sparkle)"/>
      <circle cx="-20" cy="-15" r="6" fill="#ffffff" filter="url(#sparkle)"/>
      
      <!-- 4 Platinum Double-Claw Corner Prongs -->
      <circle cx="-68" cy="-58" r="6" fill="url(#platRing)" stroke="#475569" stroke-width="1"/>
      <circle cx="68" cy="-58" r="6" fill="url(#platRing)" stroke="#475569" stroke-width="1"/>
      <circle cx="68" cy="58" r="6" fill="url(#platRing)" stroke="#475569" stroke-width="1"/>
      <circle cx="-68" cy="58" r="6" fill="url(#platRing)" stroke="#475569" stroke-width="1"/>

      <!-- Star Burst Sparkle -->
      <path d="M -20 -35 L -16 -21 L -2 -17 L -16 -13 L -20 1 L -24 -13 L -38 -17 L -24 -21 Z" fill="#ffffff" filter="url(#sparkle)"/>
    </g>

  </g>

  <!-- Title Caption -->
  <text x="400" y="525" fill="#93c5fd" font-family="'Playfair Display', serif" font-weight="700" font-size="16" letter-spacing="4" text-anchor="middle">KASHMIR VELVET SAPPHIRE</text>
  <text x="400" y="542" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">5.10 CT CUSHION CORNFLOWER BLUE · TRAPEZOID DIAMONDS · PLATINUM 950</text>
</svg>
