<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDress" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="60%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#030303"/>
    </radialGradient>
    <radialGradient id="dialEnamel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="85%" stop-color="#f2ece4"/>
      <stop offset="100%" stop-color="#e5dcce"/>
    </radialGradient>
    <linearGradient id="yellowGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff2b2"/>
      <stop offset="75%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#ffd966"/>
    </linearGradient>
    <linearGradient id="leatherStrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="dressShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgDress)"/>
  
  <!-- Warm glow aura -->
  <circle cx="400" cy="300" r="260" fill="#d4af37" opacity="0.06" filter="blur(70px)"/>

  <g filter="url(#dressShadow)">
    <!-- Glossy Leather Strap (Top & Bottom) -->
    <!-- Top Strap -->
    <path d="M 335 90 L 465 90 L 450 200 L 350 200 Z" fill="url(#leatherStrap)"/>
    <!-- Strap Stitching -->
    <line x1="345" y1="90" x2="358" y2="200" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="455" y1="90" x2="442" y2="200" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Bottom Strap -->
    <path d="M 350 400 L 450 400 L 465 510 L 335 510 Z" fill="url(#leatherStrap)"/>
    <line x1="358" y1="400" x2="345" y2="510" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="442" y1="400" x2="455" y2="510" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Slender 18K Yellow Gold Lugs -->
    <path d="M 328 150 L 352 190 C 330 235 330 365 352 410 L 328 450 C 305 390 305 210 328 150 Z" fill="url(#yellowGold)"/>
    <path d="M 472 150 L 448 190 C 470 235 470 365 448 410 L 472 450 C 495 390 495 210 472 150 Z" fill="url(#yellowGold)"/>

    <!-- Fluted Gold Crown with Sapphire Cabochon -->
    <path d="M 520 292 L 536 294 L 536 306 L 520 308 Z" fill="url(#yellowGold)"/>
    <circle cx="536" cy="300" r="3.5" fill="#1e3a8a"/>

    <!-- Polished 18K Gold Bezel -->
    <circle cx="400" cy="300" r="160" fill="url(#yellowGold)"/>
    <circle cx="400" cy="300" r="150" fill="#2d2207"/>
    <circle cx="400" cy="300" r="147" fill="url(#yellowGold)"/>

    <!-- Grand Feu Enamel Dial -->
    <circle cx="400" cy="300" r="142" fill="url(#dialEnamel)"/>

    <!-- Outer Railroad Minute Track -->
    <circle cx="400" cy="300" r="132" fill="none" stroke="#27272a" stroke-width="1"/>
    <circle cx="400" cy="300" r="126" fill="none" stroke="#27272a" stroke-width="1"/>
    
    <!-- Minute Dots -->
    <circle cx="400" cy="171" r="2.5" fill="#27272a"/>
    <circle cx="529" cy="300" r="2.5" fill="#27272a"/>
    <circle cx="400" cy="429" r="2.5" fill="#27272a"/>
    <circle cx="271" cy="300" r="2.5" fill="#27272a"/>

    <!-- Breguet Numerals -->
    <text x="400" y="208" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="28" text-anchor="middle">12</text>
    <text x="460" y="226" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="24" text-anchor="middle">1</text>
    <text x="498" y="270" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="24" text-anchor="middle">2</text>
    <text x="510" y="308" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="26" text-anchor="middle">3</text>
    <text x="496" y="348" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="24" text-anchor="middle">4</text>
    <text x="460" y="390" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="24" text-anchor="middle">5</text>
    <text x="340" y="390" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="24" text-anchor="middle">7</text>
    <text x="304" y="348" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="24" text-anchor="middle">8</text>
    <text x="290" y="308" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="26" text-anchor="middle">9</text>
    <text x="302" y="270" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="24" text-anchor="middle">10</text>
    <text x="340" y="226" fill="#18181b" font-family="'Playfair Display', serif" font-weight="600" font-size="24" text-anchor="middle">11</text>

    <!-- Small Seconds Subdial at 6 O'clock -->
    <circle cx="400" cy="370" r="32" fill="#f5eee6" stroke="#52525b" stroke-width="0.75"/>
    <circle cx="400" cy="370" r="28" fill="none" stroke="#71717a" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text x="400" y="348" fill="#52525b" font-family="'Inter', sans-serif" font-size="8" font-weight="600" text-anchor="middle">60</text>
    <text x="424" y="373" fill="#52525b" font-family="'Inter', sans-serif" font-size="8" font-weight="600" text-anchor="middle">15</text>
    <text x="400" y="396" fill="#52525b" font-family="'Inter', sans-serif" font-size="8" font-weight="600" text-anchor="middle">30</text>
    <text x="376" y="373" fill="#52525b" font-family="'Inter', sans-serif" font-size="8" font-weight="600" text-anchor="middle">45</text>
    <!-- Subdial Hand -->
    <line x1="400" y1="370" x2="385" y2="355" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="400" cy="370" r="2" fill="#d4af37"/>

    <!-- Brand Typography -->
    <text x="400" y="248" fill="#18181b" font-family="'Playfair Display', serif" font-weight="700" font-size="16" letter-spacing="4" text-anchor="middle">AURELLE</text>
    <text x="400" y="260" fill="#71717a" font-family="'Inter', sans-serif" font-size="8" letter-spacing="2.5" text-anchor="middle">GENÈVE</text>

    <!-- Blued Steel Breguet Moon Hands -->
    <!-- Hour Hand -->
    <g transform="rotate(-55 400 300)">
      <path d="M 398 300 L 398 238 A 6 6 0 1 1 402 238 L 402 300 Z" fill="#1e3a8a"/>
      <circle cx="400" cy="235" r="5" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
      <circle cx="400" cy="226" r="1.5" fill="#1e3a8a"/>
    </g>

    <!-- Minute Hand -->
    <g transform="rotate(28 400 300)">
      <path d="M 398.5 300 L 398.5 195 A 6 6 0 1 1 401.5 195 L 401.5 300 Z" fill="#1e3a8a"/>
      <circle cx="400" cy="192" r="5" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
      <circle cx="400" cy="180" r="1.5" fill="#1e3a8a"/>
    </g>

    <!-- Center Pin -->
    <circle cx="400" cy="300" r="4.5" fill="url(#yellowGold)" stroke="#1e3a8a" stroke-width="1"/>
  </g>
</svg>
