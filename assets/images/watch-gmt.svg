<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGmt" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <radialGradient id="dialMatte" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="titaniumBrushed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bezelTopDay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="bezelBottomNight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="gmtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGmt)"/>
  
  <g filter="url(#gmtShadow)">
    <!-- Titanium Bracelet (Top & Bottom) -->
    <path d="M 330 100 L 470 100 L 455 180 L 345 180 Z" fill="url(#titaniumBrushed)"/>
    <path d="M 345 420 L 455 420 L 470 500 L 330 500 Z" fill="url(#titaniumBrushed)"/>
    <line x1="375" y1="100" x2="375" y2="180" stroke="#334155" stroke-width="2"/>
    <line x1="425" y1="100" x2="425" y2="180" stroke="#334155" stroke-width="2"/>
    <line x1="375" y1="420" x2="375" y2="500" stroke="#334155" stroke-width="2"/>
    <line x1="425" y1="420" x2="425" y2="500" stroke="#334155" stroke-width="2"/>

    <!-- Grade 5 Titanium Lugs -->
    <path d="M 315 140 L 350 180 C 320 230 320 370 350 420 L 315 460 C 290 400 290 200 315 140 Z" fill="url(#titaniumBrushed)"/>
    <path d="M 485 140 L 450 180 C 480 230 480 370 450 420 L 485 460 C 510 400 510 200 485 140 Z" fill="url(#titaniumBrushed)"/>

    <!-- Screw-down Crown with Guards -->
    <path d="M 525 285 L 545 285 L 545 315 L 525 315 Z" fill="url(#titaniumBrushed)"/>
    <path d="M 505 270 L 528 285 L 528 315 L 505 330 Z" fill="url(#titaniumBrushed)"/>

    <!-- Outer Case Rim -->
    <circle cx="400" cy="300" r="170" fill="url(#titaniumBrushed)"/>

    <!-- Bi-Color Ceramic 24H Bezel (Top Half Blue 06-18, Bottom Half Black 18-06) -->
    <!-- Top Half Blue -->
    <path d="M 244 300 A 156 156 0 0 1 556 300 L 526 300 A 126 126 0 0 0 274 300 Z" fill="url(#bezelTopDay)"/>
    <!-- Bottom Half Black -->
    <path d="M 556 300 A 156 156 0 0 1 244 300 L 274 300 A 126 126 0 0 0 526 300 Z" fill="url(#bezelBottomNight)"/>

    <!-- Bezel 24H Numbers -->
    <text x="400" y="162" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="16" text-anchor="middle">24</text>
    <text x="480" y="195" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">2</text>
    <text x="530" y="260" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">4</text>
    <text x="540" y="306" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">6</text>
    <text x="530" y="350" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">8</text>
    <text x="475" y="415" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">10</text>
    <text x="400" y="445" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="16" text-anchor="middle">12</text>
    <text x="325" y="415" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">14</text>
    <text x="270" y="350" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">16</text>
    <text x="260" y="306" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">18</text>
    <text x="270" y="260" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">20</text>
    <text x="320" y="195" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15" text-anchor="middle">22</text>

    <!-- Dial Face -->
    <circle cx="400" cy="300" r="124" fill="url(#dialMatte)"/>

    <!-- Dial Text -->
    <text x="400" y="238" fill="#d4af37" font-family="'Playfair Display', serif" font-weight="700" font-size="14" letter-spacing="3" text-anchor="middle">AURELLE</text>
    <text x="400" y="252" fill="#ef4444" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="2" text-anchor="middle">GMT MASTER II</text>
    
    <text x="400" y="360" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" letter-spacing="1.5" text-anchor="middle">DUAL-TIME CHRONOMETER</text>
    <text x="400" y="372" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5" letter-spacing="1" text-anchor="middle">OFFICIALLY CERTIFIED</text>

    <!-- Date Window at 3 O'clock -->
    <rect x="470" y="288" width="28" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="484" y="305" fill="#09090b" font-family="'Inter', sans-serif" font-weight="700" font-size="13" text-anchor="middle">14</text>

    <!-- Hour Markers (White Lume with Polished Steel Borders) -->
    <!-- 12: Triangle -->
    <polygon points="400,195 388,212 412,212" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- 6 & 9: Rectangles -->
    <rect x="393" y="385" width="14" height="22" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="295" y="293" width="22" height="14" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Circles -->
    <circle cx="452" cy="214" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="486" cy="248" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="486" cy="352" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="452" cy="386" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="348" cy="386" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="314" cy="352" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="314" cy="248" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="348" cy="214" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Red 24-Hour GMT Hand -->
    <g transform="rotate(75 400 300)">
      <line x1="400" y1="300" x2="400" y2="185" stroke="#ef4444" stroke-width="2.5"/>
      <polygon points="400,175 390,195 410,195" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
      <circle cx="400" cy="188" r="3" fill="#ffffff"/>
    </g>

    <!-- Local Hour Hand -->
    <g transform="rotate(-60 400 300)">
      <path d="M 396 300 L 396 235 L 400 220 L 404 235 L 404 300 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="400" cy="235" r="5" fill="#ffffff"/>
    </g>

    <!-- Minute Hand -->
    <g transform="rotate(25 400 300)">
      <path d="M 396.5 300 L 396.5 195 L 400 185 L 403.5 195 L 403.5 300 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    </g>

    <!-- Sweep Seconds Hand -->
    <g transform="rotate(160 400 300)">
      <line x1="400" y1="330" x2="400" y2="180" stroke="#f8fafc" stroke-width="1.5"/>
      <circle cx="400" cy="210" r="4.5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
      <circle cx="400" cy="300" r="5.5" fill="#cbd5e1" stroke="#09090b" stroke-width="2"/>
    </g>
  </g>
</svg>
