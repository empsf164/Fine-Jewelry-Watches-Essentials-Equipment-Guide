<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPerp" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="dialAventurine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldMoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starSparkle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="perpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgPerp)"/>
  
  <g filter="url(#perpShadow)">
    <!-- Midnight Blue Alligator Strap -->
    <path d="M 335 90 L 465 90 L 450 200 L 350 200 Z" fill="#091428"/>
    <path d="M 350 400 L 450 400 L 465 510 L 335 510 Z" fill="#091428"/>
    <line x1="345" y1="90" x2="358" y2="200" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="455" y1="90" x2="442" y2="200" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="358" y1="400" x2="345" y2="510" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="442" y1="400" x2="455" y2="510" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Platinum 950 Lugs & Case -->
    <path d="M 326 145 L 350 190 C 325 235 325 365 350 410 L 326 455 C 300 390 300 210 326 145 Z" fill="url(#platinumGrad)"/>
    <path d="M 474 145 L 450 190 C 475 235 475 365 450 410 L 474 455 C 500 390 500 210 474 145 Z" fill="url(#platinumGrad)"/>

    <!-- Platinum Crown -->
    <path d="M 522 290 L 540 292 L 540 308 L 522 310 Z" fill="url(#platinumGrad)"/>

    <!-- Case Bezel -->
    <circle cx="400" cy="300" r="165" fill="url(#platinumGrad)"/>
    <circle cx="400" cy="300" r="154" fill="#090d16"/>
    <circle cx="400" cy="300" r="150" fill="url(#platinumGrad)"/>

    <!-- Aventurine Starlit Dial -->
    <circle cx="400" cy="300" r="144" fill="url(#dialAventurine)"/>

    <!-- Aventurine Glitter Stars -->
    <circle cx="360" cy="220" r="1.5" fill="#fef08a" opacity="0.8"/>
    <circle cx="440" cy="230" r="1" fill="#ffffff" opacity="0.9"/>
    <circle cx="320" cy="270" r="1.5" fill="#fef08a" opacity="0.7"/>
    <circle cx="480" cy="280" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="340" cy="330" r="1" fill="#fef08a" opacity="0.9"/>
    <circle cx="460" cy="340" r="1.5" fill="#fde047" opacity="0.75"/>
    <circle cx="370" cy="380" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="430" cy="390" r="1.5" fill="#fef08a" opacity="0.85"/>
    <circle cx="300" cy="310" r="1.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="500" cy="310" r="1" fill="#fde047" opacity="0.8"/>

    <!-- Subdial 1: Month & Leap Year at 12 O'clock -->
    <circle cx="400" cy="235" r="32" fill="#080e1a" stroke="#cbd5e1" stroke-width="1"/>
    <text x="400" y="218" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" text-anchor="middle">JAN · APR · JUL · OCT</text>
    <text x="400" y="240" fill="#ca8a04" font-family="'Inter', sans-serif" font-weight="700" font-size="9" text-anchor="middle">L · 1 · 2 · 3</text>
    <line x1="400" y1="235" x2="390" y2="225" stroke="#f8fafc" stroke-width="1.2"/>

    <!-- Subdial 2: Day of Week at 9 O'clock -->
    <circle cx="335" cy="300" r="30" fill="#080e1a" stroke="#cbd5e1" stroke-width="1"/>
    <text x="335" y="282" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="600" font-size="7" text-anchor="middle">MON · TUE · WED</text>
    <text x="335" y="322" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="600" font-size="7" text-anchor="middle">THU · FRI · SAT · SUN</text>
    <line x1="335" y1="300" x2="325" y2="290" stroke="#f8fafc" stroke-width="1.2"/>

    <!-- Subdial 3: Date of Month at 3 O'clock -->
    <circle cx="465" cy="300" r="30" fill="#080e1a" stroke="#cbd5e1" stroke-width="1"/>
    <text x="465" y="280" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="600" font-size="7" text-anchor="middle">31 · 5 · 10</text>
    <text x="465" y="324" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="600" font-size="7" text-anchor="middle">15 · 20 · 25</text>
    <line x1="465" y1="300" x2="475" y2="290" stroke="#f8fafc" stroke-width="1.2"/>

    <!-- Subdial 4: 122-Year Moonphase at 6 O'clock -->
    <circle cx="400" cy="365" r="36" fill="#050a14" stroke="#d4af37" stroke-width="1.5"/>
    <!-- Moon Aperture Bridge -->
    <path d="M 370 365 C 370 340 430 340 430 365 C 430 390 370 390 370 365 Z" fill="#040711"/>
    <!-- Golden Moon Disc -->
    <circle cx="395" cy="360" r="14" fill="url(#goldMoon)" filter="url(#moonGlow)"/>
    <circle cx="388" cy="356" r="2.5" fill="#ca8a04" opacity="0.4"/>
    <circle cx="398" cy="365" r="3" fill="#ca8a04" opacity="0.3"/>
    <text x="400" y="392" fill="#ca8a04" font-family="'Inter', sans-serif" font-weight="600" font-size="7" letter-spacing="1" text-anchor="middle">ASTRONOMIC 122 YR</text>

    <!-- Brand Typography -->
    <text x="400" y="275" fill="#f8fafc" font-family="'Playfair Display', serif" font-weight="700" font-size="13" letter-spacing="3" text-anchor="middle">AURELLE</text>
    <text x="400" y="322" fill="#d4af37" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" letter-spacing="2" text-anchor="middle">PERPETUAL CALENDAR</text>

    <!-- White Gold Leaf Hands -->
    <!-- Hour Hand -->
    <g transform="rotate(-70 400 300)">
      <path d="M 398 300 C 395 260 395 240 400 230 C 405 240 405 260 402 300 Z" fill="url(#platinumGrad)"/>
    </g>

    <!-- Minute Hand -->
    <g transform="rotate(40 400 300)">
      <path d="M 398.5 300 C 396 230 396 195 400 180 C 404 195 404 230 401.5 300 Z" fill="url(#platinumGrad)"/>
    </g>

    <circle cx="400" cy="300" r="4.5" fill="url(#platinumGrad)" stroke="#0f172a" stroke-width="1"/>
  </g>
</svg>
