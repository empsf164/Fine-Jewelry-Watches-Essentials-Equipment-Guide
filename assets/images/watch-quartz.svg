<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgQuartz" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e242c"/>
      <stop offset="60%" stop-color="#0f1318"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <radialGradient id="dialSilver" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="platinum950" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="quartzShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgQuartz)"/>
  
  <g filter="url(#quartzShadow)">
    <!-- Navy Suede Strap -->
    <path d="M 335 90 L 465 90 L 450 200 L 350 200 Z" fill="#1e293b"/>
    <path d="M 350 400 L 450 400 L 465 510 L 335 510 Z" fill="#1e293b"/>
    <line x1="345" y1="90" x2="358" y2="200" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="455" y1="90" x2="442" y2="200" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="358" y1="400" x2="345" y2="510" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="442" y1="400" x2="455" y2="510" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Platinum 950 Lugs -->
    <path d="M 328 150 L 352 190 C 330 235 330 365 352 410 L 328 450 C 305 390 305 210 328 150 Z" fill="url(#platinum950)"/>
    <path d="M 472 150 L 448 190 C 470 235 470 365 448 410 L 472 450 C 495 390 495 210 472 150 Z" fill="url(#platinum950)"/>

    <!-- Crown -->
    <path d="M 520 292 L 536 294 L 536 306 L 520 308 Z" fill="url(#platinum950)"/>

    <!-- Platinum Bezel -->
    <circle cx="400" cy="300" r="160" fill="url(#platinum950)"/>
    <circle cx="400" cy="300" r="150" fill="#0f172a"/>
    <circle cx="400" cy="300" r="147" fill="url(#platinum950)"/>

    <!-- Frosted Silver Dial -->
    <circle cx="400" cy="300" r="142" fill="url(#dialSilver)"/>

    <!-- Guilloché Textured Center Ring -->
    <circle cx="400" cy="300" r="90" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="400" cy="300" r="85" fill="none" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="2 2"/>

    <!-- Roman Numerals -->
    <text x="400" y="200" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="22" text-anchor="middle">XII</text>
    <text x="455" y="215" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="20" text-anchor="middle">I</text>
    <text x="495" y="255" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="20" text-anchor="middle">II</text>
    <text x="510" y="306" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="22" text-anchor="middle">III</text>
    <text x="495" y="355" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="20" text-anchor="middle">IIII</text>
    <text x="455" y="395" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="20" text-anchor="middle">V</text>
    <text x="400" y="412" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="22" text-anchor="middle">VI</text>
    <text x="345" y="395" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="20" text-anchor="middle">VII</text>
    <text x="305" y="355" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="20" text-anchor="middle">VIII</text>
    <text x="290" y="306" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="22" text-anchor="middle">IX</text>
    <text x="305" y="255" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="20" text-anchor="middle">X</text>
    <text x="345" y="215" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="20" text-anchor="middle">XI</text>

    <!-- Brand Typography -->
    <text x="400" y="245" fill="#0f172a" font-family="'Playfair Display', serif" font-weight="700" font-size="15" letter-spacing="3.5" text-anchor="middle">AURELLE</text>
    <text x="400" y="258" fill="#d4af37" font-family="'Inter', sans-serif" font-weight="600" font-size="8" letter-spacing="2" text-anchor="middle">CHRONOMÈTRE SOUVERAIN</text>
    <text x="400" y="355" fill="#64748b" font-family="'Inter', sans-serif" font-size="7.5" letter-spacing="1.5" text-anchor="middle">HIGH PRECISION ±5S / YR</text>

    <!-- Gold Hour & Minute Hands -->
    <g transform="rotate(-65 400 300)">
      <path d="M 397 300 L 397 235 L 400 220 L 403 235 L 403 300 Z" fill="#d4af37"/>
    </g>
    <g transform="rotate(35 400 300)">
      <path d="M 397.5 300 L 397.5 190 L 400 178 L 402.5 190 L 402.5 300 Z" fill="#d4af37"/>
    </g>

    <!-- Blued Steel Dead-Beat Seconds Hand (Long & Slender with Counterweight) -->
    <g transform="rotate(145 400 300)">
      <line x1="400" y1="340" x2="400" y2="175" stroke="#1d4ed8" stroke-width="1.75"/>
      <circle cx="400" cy="325" r="4.5" fill="#1d4ed8"/>
      <circle cx="400" cy="300" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>
</svg>
