<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Credentials — AURELLE</title>
  <meta name="description"
    content="Reset your Aurelle collector password to regain access to your saved collection.">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

  <!-- FLOATING TOP-RIGHT THEME TOGGLE BUTTON -->
  <div style="position: fixed; top: 1.5rem; right: 1.5rem; z-index: 100;">
    <button class="theme-toggle-btn" aria-label="Toggle Theme"
      style="background: var(--bg-card); border: 1px solid var(--border-medium); width: 44px; height: 44px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); cursor: pointer; color: var(--text-primary); transition: all var(--transition-fast);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
  </div>

  <!-- MAIN RESET WRAPPER (NO NAVBAR / NO FOOTER) -->
  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- BRAND LOGO INSIDE BOX IN TOP CENTER -->
      <div class="auth-brand-header" style="text-align: center; margin-bottom: 1.75rem;">
        <a href="index.html" class="brand-logo" style="font-size: 1.85rem; letter-spacing: 0.18em; text-decoration: none; display: inline-block;">
          AURELLE<span class="brand-dot"></span>
        </a>
      </div>

      <div class="auth-card-header" style="margin-bottom: 1.75rem;">
        <span class="eyebrow">Credential Recovery</span>
        <h1 style="font-size: 1.85rem; margin-top: 0.25rem; margin-bottom: 0.4rem;">Reset Password</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Enter your registered collector email address to receive password instructions.</p>
      </div>

      <div id="reset-alert"
        style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-xs); font-size: 0.85rem; margin-bottom: 1.25rem;">
      </div>

      <form id="reset-form" class="auth-form" onsubmit="handleReset(event)">
        <!-- Input Field (Separate Line) -->
        <div class="form-group">
          <label class="form-label" for="reset-email">Collector Email</label>
          <input type="email" id="reset-email" class="form-input" placeholder="collector@aurelle.luxury" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Send Recovery Link &rarr;</button>
      </form>

      <div style="text-align: center; margin-top: 2rem; font-size: 0.825rem; color: var(--text-muted);">
        Remembered your key? <a href="login.html" style="color: var(--accent-gold); font-weight: 500; text-decoration: none;">Return to Sign In</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const alertBox = document.getElementById('reset-alert');
      const form = document.getElementById('reset-form');

      const res = window.AURELLE_AUTH.resetPassword(email);
      if (res.success) {
        alertBox.style.background = 'rgba(104, 166, 125, 0.15)';
        alertBox.style.borderColor = 'var(--success)';
        alertBox.style.color = 'var(--success)';
        alertBox.textContent = res.message;
        alertBox.style.display = 'block';
        form.style.display = 'none';
      } else {
        alertBox.style.background = 'rgba(214, 109, 103, 0.15)';
        alertBox.style.borderColor = 'var(--error)';
        alertBox.style.color = 'var(--error)';
        alertBox.textContent = res.message;
        alertBox.style.display = 'block';
      }
    }
  </script>

</body>

</html>
