<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Collector Account — AURELLE</title>
  <meta name="description"
    content="Join the Aurelle collector guild to curate personal dossiers, save high jewelry references, and compare movements.">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

  <!-- FLOATING TOP-RIGHT THEME TOGGLE BUTTON -->
  <div style="position: fixed; top: 1.5rem; right: 1.5rem; z-index: 100;">
    <button class="theme-toggle-btn" aria-label="Toggle Theme"
      style="background: var(--bg-card); border: 1px solid var(--border-medium); width: 44px; height: 44px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); cursor: pointer; color: var(--text-primary); transition: all var(--transition-fast);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
  </div>

  <!-- MAIN SIGNUP WRAPPER (NO NAVBAR / NO FOOTER) -->
  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      
      <!-- BRAND LOGO INSIDE BOX IN TOP CENTER -->
      <div class="auth-brand-header" style="text-align: center; margin-bottom: 1.75rem;">
        <a href="index.html" class="brand-logo" style="font-size: 1.85rem; letter-spacing: 0.18em; text-decoration: none; display: inline-block;">
          AURELLE<span class="brand-dot"></span>
        </a>
      </div>

      <div class="auth-card-header" style="margin-bottom: 1.75rem;">
        <span class="eyebrow">Collector Membership</span>
        <h1 style="font-size: 1.85rem; margin-top: 0.25rem; margin-bottom: 0.4rem;">Create Your Account</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Curate personal portfolios, compare technical specs, and save editorial treatises.</p>
      </div>

      <div id="signup-alert"
        style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-xs); background: rgba(214, 109, 103, 0.15); border: 1px solid var(--error); color: var(--error); font-size: 0.825rem; margin-bottom: 1.25rem;">
      </div>

      <form class="auth-form" onsubmit="handleSignup(event)">
        <!-- Input Field 1: Full Name -->
        <div class="form-group">
          <label class="form-label" for="su-name">Full Name</label>
          <input type="text" id="su-name" class="form-input" placeholder="Lord / Lady / Collector Name" required>
        </div>

        <!-- Input Field 2: Email Address -->
        <div class="form-group">
          <label class="form-label" for="su-email">Email Address</label>
          <input type="email" id="su-email" class="form-input" placeholder="collector@domain.luxury" required>
        </div>

        <!-- Input Field 3: Password with Eye Toggle -->
        <div class="form-group">
          <label class="form-label" for="su-pass">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="su-pass" class="form-input" placeholder="••••••••••••" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('su-pass', this)" aria-label="Toggle password visibility" title="Show/Hide Password">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Input Field 4: Confirm Password with Eye Toggle -->
        <div class="form-group">
          <label class="form-label" for="su-confirm">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="su-confirm" class="form-input" placeholder="••••••••••••" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('su-confirm', this)" aria-label="Toggle password visibility" title="Show/Hide Password">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Interests Section -->
        <div style="margin-top: 0.5rem;">
          <label class="form-label" style="display: block; margin-bottom: 0.65rem;">What interests you most? (Optional)</label>
          <div class="grid grid-2" style="gap: 0.6rem;">
            <label class="custom-checkbox" style="cursor: pointer;">
              <input type="checkbox" name="interest" value="Fine Jewelry" checked>
              <span class="checkbox-mark"></span>
              <span style="font-size: 0.82rem; color: var(--text-secondary);">Fine Jewelry</span>
            </label>
            <label class="custom-checkbox" style="cursor: pointer;">
              <input type="checkbox" name="interest" value="Watches" checked>
              <span class="checkbox-mark"></span>
              <span style="font-size: 0.82rem; color: var(--text-secondary);">Luxury Watches</span>
            </label>
            <label class="custom-checkbox" style="cursor: pointer;">
              <input type="checkbox" name="interest" value="Gemstones">
              <span class="checkbox-mark"></span>
              <span style="font-size: 0.82rem; color: var(--text-secondary);">Gemstones</span>
            </label>
            <label class="custom-checkbox" style="cursor: pointer;">
              <input type="checkbox" name="interest" value="Craftsmanship">
              <span class="checkbox-mark"></span>
              <span style="font-size: 0.82rem; color: var(--text-secondary);">Craftsmanship</span>
            </label>
            <label class="custom-checkbox" style="cursor: pointer;">
              <input type="checkbox" name="interest" value="Collecting">
              <span class="checkbox-mark"></span>
              <span style="font-size: 0.82rem; color: var(--text-secondary);">Collecting</span>
            </label>
            <label class="custom-checkbox" style="cursor: pointer;">
              <input type="checkbox" name="interest" value="Care & Essentials">
              <span class="checkbox-mark"></span>
              <span style="font-size: 0.82rem; color: var(--text-secondary);">Care & Essentials</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">Create Your Account &rarr;</button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">Or Continue With</div>

      <!-- Social Icons at Bottom: Google & Apple -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <button type="button" onclick="demoGoogleSignup()" class="btn btn-outline"
          style="font-size: 0.825rem; gap: 0.5rem; justify-content: center; padding: 0.7rem 1rem;">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
          </svg>
          <span>Google</span>
        </button>

        <button type="button" onclick="demoAppleSignup()" class="btn btn-outline"
          style="font-size: 0.825rem; gap: 0.5rem; justify-content: center; padding: 0.7rem 1rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.62-.75 1.04-1.8 0.92-2.84-.9.04-2 .6-2.65 1.36-.58.67-1.09 1.74-.95 2.77.99.08 2.05-.53 2.68-1.29z" />
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <div style="text-align: center; margin-top: 2rem; font-size: 0.825rem; color: var(--text-muted);">
        Already registered? <a href="login.html" class="auth-link">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/bookmarks.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword
        ? `<svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        : `<svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    }

    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('su-name').value;
      const email = document.getElementById('su-email').value;
      const pass = document.getElementById('su-pass').value;
      const confirm = document.getElementById('su-confirm').value;
      const alertBox = document.getElementById('signup-alert');

      if (pass !== confirm) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.style.display = 'block';
        return;
      }

      const interests = [];
      document.querySelectorAll('input[name="interest"]:checked').forEach(cb => interests.push(cb.value));

      const res = window.AURELLE_AUTH.signup(name, email, pass, interests);
      if (res.success) {
        window.location.href = 'saved.html';
      } else {
        alertBox.textContent = res.message;
        alertBox.style.display = 'block';
      }
    }

    function demoGoogleSignup() {
      window.AURELLE_AUTH.signup('Julian Vance', 'collector@aurelle.luxury', 'password123', ['Watches', 'Fine Jewelry']);
      window.location.href = 'saved.html';
    }

    function demoAppleSignup() {
      window.AURELLE_AUTH.signup('Julian Vance', 'collector@aurelle.luxury', 'password123', ['Watches', 'Fine Jewelry']);
      window.location.href = 'saved.html';
    }
  </script>

</body>

</html>
